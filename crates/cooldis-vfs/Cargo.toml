[package]
name = "cooldis-vfs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
bashkit = { version = "0.9.0", features = ["realfs"] }
futures-util = "0.3.32"
object_store = { version = "0.13.2", features = ["aws"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
