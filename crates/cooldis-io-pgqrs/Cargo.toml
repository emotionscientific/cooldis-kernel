[package]
name = "cooldis-io-pgqrs"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["sqlite"]
sqlite = ["pgqrs/sqlite"]
postgres = ["pgqrs/postgres"]

[dependencies]
async-trait = "0.1"
cooldis-io-core = { path = "../cooldis-io-core" }
pgqrs = { version = "0.15.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
