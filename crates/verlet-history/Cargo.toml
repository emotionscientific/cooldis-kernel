[package]
name = "verlet-history"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
verlet-runtime-contracts = { path = "../verlet-runtime-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v7"] }
