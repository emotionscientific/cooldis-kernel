[package]
name = "cooldis-io-telegram"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
cooldis-io-core = { path = "../cooldis-io-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
