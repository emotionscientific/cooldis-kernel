[package]
name = "cooldis-history-sqlite"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
cooldis-history = { path = "../cooldis-history" }
cooldis-runtime-contracts = { path = "../cooldis-runtime-contracts" }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
