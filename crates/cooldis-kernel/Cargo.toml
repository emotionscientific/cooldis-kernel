[package]
name = "cooldis"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bashkit = { version = "0.14.3", features = ["realfs"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
cooldis-agent = { path = "../cooldis-agent" }
cooldis-abi = { path = "../cooldis-abi" }
cooldis-history = { path = "../cooldis-history" }
cooldis-history-sqlite = { path = "../cooldis-history-sqlite" }
cooldis-io-core = { path = "../cooldis-io-core" }
cooldis-io-pgqrs = { path = "../cooldis-io-pgqrs" }
cooldis-io-telegram = { path = "../cooldis-io-telegram" }
cooldis-metadata = { path = "../cooldis-metadata" }
cooldis-operations = { path = "../cooldis-operations" }
cooldis-process = { path = "../cooldis-process" }
cooldis-provider = { path = "../cooldis-provider" }
cooldis-runtime-contracts = { path = "../cooldis-runtime-contracts" }
cooldis-sqlite = { path = "../cooldis-sqlite" }
cooldis-vfs = { path = "../cooldis-vfs" }
cooldis-vbash = { path = "../cooldis-vbash" }
cooldis-wasm = { path = "../cooldis-wasm" }
croner = "3.0.1"
crossterm = { version = "0.28.1", features = ["event-stream"] }
futures-util = "0.3.32"
libc = "0.2"
object_store = { version = "0.13.2", features = ["aws"] }
ratatui = "=0.30.2"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# ADR 0005 decision 8: retained for the ingress IO-state enclave until EMO-409.
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.28"
tokio-util = "0.7"
toml = "0.9"
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[dev-dependencies]
futures-executor = "0.3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time", "test-util"] }
wat = "1"

[[bin]]
name = "cooldis"
path = "src/bin/cooldis.rs"

[[bin]]
name = "cooldis-mcp-server"
path = "src/bin/cooldis-mcp-server.rs"

[[bin]]
name = "cooldis-acp-agent"
path = "src/bin/cooldis-acp-agent.rs"

[[bin]]
name = "cooldis-app-server-smoke"
path = "tests/smokes/cooldis-app-server-smoke.rs"

[[bin]]
name = "cooldis-bifrost-smoke"
path = "tests/smokes/cooldis-bifrost-smoke.rs"

[[bin]]
name = "cooldis-restart-smoke"
path = "tests/smokes/cooldis-restart-smoke.rs"

[[bin]]
name = "cooldis-manifest-e2e-smoke"
path = "tests/smokes/cooldis-manifest-e2e-smoke.rs"

[[bin]]
name = "cooldis-mcp-echo-server"
path = "tests/support_bins/cooldis-mcp-echo-server.rs"

[[bin]]
name = "cooldis-sync-test-peer"
path = "tests/support_bins/cooldis-sync-test-peer.rs"

[[bin]]
name = "cooldis-plugin-live-smoke"
path = "tests/smokes/cooldis-plugin-live-smoke.rs"

[[bin]]
name = "cooldis-sandbox-probe"
path = "tests/smokes/cooldis-sandbox-probe.rs"

[[bin]]
name = "cooldis-vbash-smoke"
path = "tests/smokes/cooldis-vbash-smoke.rs"

[[bin]]
name = "cooldis-wasm-smoke"
path = "tests/smokes/cooldis-wasm-smoke.rs"

[[bin]]
name = "cooldis-workbench-smoke"
path = "tests/smokes/cooldis-workbench-smoke.rs"
