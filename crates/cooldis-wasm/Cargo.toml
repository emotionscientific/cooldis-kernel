[package]
name = "cooldis-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bashkit = { version = "0.14.3", features = ["realfs"] }
cooldis-abi = { path = "../cooldis-abi" }
cooldis-process = { path = "../cooldis-process" }
cooldis-runtime-contracts = { path = "../cooldis-runtime-contracts" }
cooldis-vfs = { path = "../cooldis-vfs" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "net"] }
wasmtime = { version = "44.0.1", default-features = false, features = ["async", "cache", "cranelift", "runtime", "std"] }
