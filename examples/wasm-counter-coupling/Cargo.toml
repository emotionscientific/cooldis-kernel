[package]
name = "cooldis-example-wasm-counter-coupling"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
cooldis-guest-sdk = { path = "../../crates/cooldis-guest-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
