<svg viewBox="0 0 840 270" role="img" aria-label="Every possible next step passes one checkpoint; a dial on the checkpoint selects between a fixed rule answering and the model choosing">
    <defs><marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
    <!-- candidates -->
    <g font-weight="700">
      <rect x="40" y="40" width="130" height="36" rx="18" fill="var(--card)" stroke="currentColor" stroke-width="2"/><text x="105" y="64" text-anchor="middle">call the model</text>
      <rect x="40" y="92" width="130" height="36" rx="18" fill="var(--card)" stroke="currentColor" stroke-width="2"/><text x="105" y="116" text-anchor="middle">run a tool</text>
      <rect x="40" y="144" width="130" height="36" rx="18" fill="var(--card)" stroke="currentColor" stroke-width="2"/><text x="105" y="168" text-anchor="middle">spawn a helper</text>
      <rect x="40" y="196" width="130" height="36" rx="18" fill="var(--card)" stroke="currentColor" stroke-width="2"/><text x="105" y="220" text-anchor="middle">stop</text>
    </g>
    <g stroke="currentColor" stroke-width="2" fill="none">
      <path d="M175 58 q100 0 160 70" marker-end="url(#a8)"/><path d="M175 110 q80 0 160 18" marker-end="url(#a8)"/>
      <path d="M175 162 q80 0 160 -30" marker-end="url(#a8)"/><path d="M175 214 q100 0 160 -80" marker-end="url(#a8)"/>
    </g>
    <!-- gate -->
    <rect x="345" y="90" width="150" height="90" rx="10" fill="var(--hold-soft)" stroke="currentColor" stroke-width="3"/>
    <text x="420" y="118" text-anchor="middle" font-weight="700" font-size="15">one checkpoint</text>
    <!-- dial -->
    <path d="M380 165 a40 40 0 0 1 80 0" fill="none" stroke="currentColor" stroke-width="3"/>
    <line x1="420" y1="165" x2="445" y2="138" stroke="var(--maybe)" stroke-width="4" stroke-linecap="round"/>
    <text x="372" y="178" text-anchor="end" font-size="11" fill="var(--sure)" font-weight="700">fixed rule</text>
    <text x="468" y="178" font-size="11" fill="var(--maybe)" font-weight="700">model picks</text>
    <!-- out -->
    <line x1="500" y1="135" x2="600" y2="135" stroke="currentColor" stroke-width="3" marker-end="url(#a8)"/>
    <rect x="610" y="115" width="190" height="40" rx="6" fill="var(--card)" stroke="currentColor" stroke-width="2"/>
    <text x="705" y="140" text-anchor="middle" font-weight="700">the one that runs</text>
    <text x="705" y="185" text-anchor="middle" fill="var(--pencil)">+ the decision is written down</text>
    <text x="420" y="40" text-anchor="middle" fill="var(--pencil)">no side door. everything that runs came through here.</text>
    <text x="420" y="255" text-anchor="middle" font-weight="700"><tspan fill="var(--sure)">dial left = "workflow"</tspan>   <tspan fill="var(--maybe)">dial right = "agent"</tspan>   same machine.</text>
  </svg>
