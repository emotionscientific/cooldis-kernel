<svg viewBox="0 0 840 230" role="img" aria-label="The same agent and its notebook move from a laptop to a cloud host; the tool belt travels with the notebook, not the machine; on the host each tenant sits in its own fence">
    <defs><marker id="a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
    <!-- laptop -->
    <rect x="60" y="60" width="200" height="110" rx="8" fill="var(--card)" stroke="currentColor" stroke-width="2.5"/>
    <rect x="40" y="170" width="240" height="12" rx="3" fill="currentColor"/>
    <text x="160" y="205" text-anchor="middle" font-weight="700">laptop</text>
    <circle cx="120" cy="115" r="22" fill="var(--sure-soft)" stroke="currentColor" stroke-width="2"/>
    <rect x="160" y="90" width="80" height="50" rx="4" fill="var(--card)" stroke="currentColor" stroke-width="2"/>
    <line x1="172" y1="90" x2="172" y2="140" stroke="currentColor" stroke-width="1.5"/>
    <text x="205" y="118" text-anchor="middle" font-size="11" font-weight="700">notebook</text>
    <!-- arrow -->
    <line x1="300" y1="115" x2="440" y2="115" stroke="currentColor" stroke-width="3" marker-end="url(#a12)"/>
    <text x="370" y="100" text-anchor="middle" font-size="12">move</text>
    <text x="370" y="140" text-anchor="middle" font-size="12" fill="var(--sure)" font-weight="700">belt travels with it</text>
    <!-- cloud host with fences -->
    <rect x="460" y="40" width="340" height="150" rx="8" fill="var(--card)" stroke="currentColor" stroke-width="2.5"/>
    <text x="630" y="215" text-anchor="middle" font-weight="700">shared cloud host</text>
    <rect x="475" y="60" width="100" height="115" rx="6" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="585" y="60" width="100" height="115" rx="6" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="695" y="60" width="90" height="115" rx="6" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="525" cy="105" r="20" fill="var(--sure-soft)" stroke="currentColor" stroke-width="2"/>
    <rect x="500" y="135" width="50" height="28" rx="3" fill="var(--card)" stroke="currentColor" stroke-width="1.5"/>
    <text x="525" y="153" text-anchor="middle" font-size="9" font-weight="700">notebook</text>
    <circle cx="635" cy="105" r="20" fill="var(--maybe-soft)" stroke="currentColor" stroke-width="2"/>
    <circle cx="740" cy="105" r="20" fill="var(--hold-soft)" stroke="currentColor" stroke-width="2"/>
    <text x="525" y="52" text-anchor="middle" font-size="10" fill="var(--pencil)">you</text>
    <text x="635" y="52" text-anchor="middle" font-size="10" fill="var(--pencil)">acme</text>
    <text x="740" y="52" text-anchor="middle" font-size="10" fill="var(--pencil)">globex</text>
  </svg>
