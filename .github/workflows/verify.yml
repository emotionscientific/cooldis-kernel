name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  remote-sentinel:
    name: Remote sentinel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - name: Verify remote sentinel
        run: scripts/check-remote-ci.sh

  tests:
    name: Workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Verify workspace
        shell: bash
        run: scripts/verify.sh 2>&1 | tee verify-output.log
      - name: Upload witnessed verify output
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: verify-output.log
          if-no-files-found: error

  tests-macmini:
    name: Workspace tests (macmini)
    # Public repo + self-hosted runner: never run fork-PR code on our hardware.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macmini]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      # No rust-cache here: the runner is a persistent machine, so the target
      # directory in its work folder stays warm between runs. Cargo never
      # garbage-collects stale artifacts, so bound the persistent state before
      # each build; a cold rebuild costs ~20 minutes, a full disk stops the
      # machine.
      - name: Bound persistent cargo state
        shell: bash
        run: |
          target_root="$(dirname "$GITHUB_WORKSPACE")/.cargo-target"
          target_cap_gb=40
          min_free_gb=25

          used_gb=0
          if [[ -d "$target_root" ]]; then
            used_gb=$(($(du -sk "$target_root" | cut -f1) / 1024 / 1024))
          fi
          free_gb=$(($(df -k / | awk 'NR==2 {print $4}') / 1024 / 1024))
          echo "cargo target: ${used_gb}G (cap ${target_cap_gb}G), disk free: ${free_gb}G (min ${min_free_gb}G)"

          if (( used_gb > target_cap_gb )) || (( free_gb < min_free_gb )); then
            echo "pruning $target_root"
            rm -rf "$target_root"
          fi
      - name: Verify workspace
        shell: bash
        run: scripts/verify.sh

  restart-smoke:
    name: Process restart smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Build daemon
        run: cargo build --locked --bin cooldis
      - name: Verify process restart continuity
        run: cargo run --locked --bin cooldis-restart-smoke

  receipts:
    name: Publish witnessed receipt
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: receipts-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Download witnessed verify output
        uses: actions/download-artifact@v4
        with:
          name: verify-output
      - name: Publish receipt
        shell: bash
        run: scripts/ci-receipts.sh verify-output.log
