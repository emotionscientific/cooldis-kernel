name: Tap dispatch check

# Temporary probe: verifies TAP_DISPATCH_TOKEN can dispatch the Homebrew tap
# updater (same command as the release workflow). Delete after one green run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Homebrew tap update
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "TAP_DISPATCH_TOKEN not configured" >&2
            exit 1
          fi
          gh workflow run update-cooldis.yml --repo emotionscientific/homebrew-tap
